{{ define "main" }}
<section class="hero">
  <div class="container">
    <img src="{{ "images/logo.png" | relURL }}" alt="EATWISE" class="hero-logo">
    <h1 class="hero-tagline">{{ .Params.hero_tagline }}</h1>
  </div>
</section>

<section class="home-intro">
  <div class="container">
    <div class="intro-prose">
      {{ .Content }}
    </div>
    <div class="cta-row">
      {{ range .Params.cta }}
        <a href="{{ .url | relLangURL }}" class="btn btn-primary">{{ .text }} →</a>
      {{ end }}
    </div>
  </div>
</section>

{{ with .Params.stats }}
<section class="home-section stats-section">
  <div class="container">
    <h2>{{ $.Params.stats_heading }}</h2>
    <div class="stats-grid">
      {{ range . }}
        <div class="stat-card">
          <div class="stat-value">{{ .value }}</div>
          <p class="stat-text">{{ .text }}</p>
        </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
{{ end }}
