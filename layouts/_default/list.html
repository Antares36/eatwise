{{ define "main" }}
<section class="page-content">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    {{ $palette := slice "#EEA1A1" "#F5CBAF" "#E9D597" "#C7EA93" "#4AE8C8" }}
    {{ range $i, $p := .Pages }}
    <a class="child-page-card" href="{{ $p.RelPermalink }}" style="--card-accent: {{ index $palette (mod $i 5) }};">
      <h3>{{ $p.Title }}</h3>
      {{ with $p.Description }}<p>{{ . }}</p>{{ end }}
      <span class="card-arrow" aria-hidden="true">→</span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
