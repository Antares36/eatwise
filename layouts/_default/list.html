{{ define "main" }}
<section class="page-content">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    {{ range .Pages }}
    <a class="child-page-card" href="{{ .RelPermalink }}">
      <h3>{{ .Title }}</h3>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
      <span class="card-arrow" aria-hidden="true">→</span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
